[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nowplaying-player"
version = "1.0.0"
description = "Плеер-виджет: показывает, какая музыка играет на компьютере в браузере или приложении"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "Pillow>=10.0",
  "winrt-runtime>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
]

[project.scripts]
nowplaying = "nowplaying.cli:main"

[tool.setuptools.packages.find]
include = ["nowplaying*"]
